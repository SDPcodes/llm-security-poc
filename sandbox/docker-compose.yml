version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pocuser
      POSTGRES_PASSWORD: pocpass123
      POSTGRES_DB: pocdb
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - poc-network
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://pocuser:pocpass123@db:5432/pocdb
      JWT_SECRET: test-secret-for-poc-only
      PORT: "5000"
    depends_on:
      - db
    networks:
      - poc-network
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - poc-network
networks:
  poc-network:
    driver: bridge
